modules:
  - type: rpm-ostree
    # remove:
    #   - xdg-desktop-portal-hyprland
    install:
      # - xdg-desktop-portal-wlr
      - xwaylandvideobridge
      - swaybg
      - hyprsunset
      - hyprlauncher
      - hyprpicker
      - hyprsysteminfo
      - hyprshutdown
  - type: files
    files:
      - source: system/hyprland/share
        destination: /usr/share/hypr/
      - source: system/hyprland/share-hyprland
        destination: /usr/share/hyprland/
    
