modules:
  - type: dnf
    # remove:
    #   packages:
    #     - xdg-desktop-portal-hyprland
    install:
      packages:
        # - xdg-desktop-portal-wlr
        - xwaylandvideobridge
        - swaybg
        - hyprsunset
        - hyprlauncher
        - hyprpicker
        - hyprsysteminfo
        - hyprshutdown
  - type: files
    files:
      - source: system/hyprland/share
        destination: /usr/share/hypr/
      - source: system/hyprland/share-hyprland
        destination: /usr/share/hyprland/
    
